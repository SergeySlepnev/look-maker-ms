name: CI - Auth service (Java 21, Gradle)

on:
  push:
    branches: [ develop ]
    paths:
      - 'services/auth/**'
  pull_request:
    branches: [ develop ]
    paths:
      - 'services/auth/**'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle.lockfile', 'services/auth/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build and run test
        run: ./gradlew :services:auth:clean :services:auth:build