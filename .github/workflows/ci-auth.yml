name: CI - Auth service (Java 21, Gradle)

on:
  push:
    branches: [ develop ]
    paths:
      - 'services/auth/**'
  pull_request:
    branches: [ develop ]
    paths:
      - 'services/auth/**'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle.lockfile', 'services/auth/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Enable verbose logs for Testcontainers and Liquibase
        run: |
          echo "SPRING_PROFILES_ACTIVE=test" >> $GITHUB_ENV
          echo "LOG_LEVEL_TESTCONTAINERS=DEBUG" >> $GITHUB_ENV  

      - name: Build and run test
        run: ./gradlew :services:auth:clean :services:auth:build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: auth-integration-test-reports
          path: services/auth/build/reports/tests/integrationTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: auth-integration-test-results
          path: services/auth/build/test-results/integrationTest